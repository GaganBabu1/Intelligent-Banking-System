spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwtSecret=mySecretKeyForBankingApplicationThatIsAtLeast256BitsLongForHS256Algorithm
app.jwtAccessTokenExpiration=900000
app.jwtRefreshTokenExpiration=604800000

springdoc.swagger-ui.enabled=false
