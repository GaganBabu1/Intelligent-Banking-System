name: Banking Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and build backend
        run: ./mvnw --batch-mode test package

  frontend:
    name: Install frontend dependencies
    run: npm ci

    name: Lint frontend
    run: npm run lint

    name: Build frontend
    run: npm run build